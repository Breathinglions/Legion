name: Build PrideQuest

on:
  push:
    branches: [ pridequest-build, pridequest-v0.2 ]
  workflow_dispatch:

concurrency:
  group: pridequest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: PrideQuest-v0.2.0
          path: build/libs/pridequest-0.2.0.jar
          if-no-files-found: error
